name: Feature request
description: Propose a focused improvement to Notch
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this address?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Describe the smallest complete behavior that would solve the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Could this be implemented as a Lua extension, executable plugin, or MCP server instead of core behavior?
  - type: textarea
    id: impact
    attributes:
      label: Compatibility and cost
      description: Note any effect on providers, sessions, startup time, memory, terminal behavior, or the single-binary goal.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: I have not included credentials or private data.
          required: true
